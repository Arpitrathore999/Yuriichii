<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Elara UNO</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;--gold:#f2bd00}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;color:#fff;background:radial-gradient(ellipse at 50% 20%,#26752c,#14511e 40%,#071e12);min-height:100vh}.app{max-width:650px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:14px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:11px;letter-spacing:3px;color:#c7d8c9}.panel{background:#0b0d0bee;border:1px solid #454b44;border-radius:24px;padding:18px;box-shadow:0 18px 55px #0005}.title{text-align:center;font-size:48px;font-weight:950;margin:8px}.sub{text-align:center;color:#b4c6b5;letter-spacing:4px;font-size:11px;margin-bottom:14px}.section{font-size:11px;letter-spacing:3px;color:#aab5ac;font-weight:800;margin:10px 0}.field,.player{background:#191d19;border:1px solid #454a44;border-radius:14px;padding:12px;margin:8px 0;display:flex;align-items:center;gap:10px}.player span:last-child{margin-left:auto}.muted{color:#b8c4ba;font-size:12px}.btn{border:0;border-radius:14px;padding:14px;font-weight:900;font-size:14px;background:var(--gold);color:#090909;width:100%;cursor:pointer}.secondary{background:#262b26;color:#fff;border:1px solid #4c534c}.row{display:flex;gap:8px}.row>*{flex:1}.hidden{display:none!important}.table{min-height:34vh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:10px 0}.piles{display:flex;align-items:center;gap:24px;margin:18px}.card{width:70px;height:105px;border:4px solid white;border-radius:13px;display:grid;place-items:center;font-weight:1000;font-size:28px;color:white;text-shadow:1px 2px 2px #333;box-shadow:0 7px 0 #0004;flex-shrink:0;cursor:pointer}.red{background:#e32636}.blue{background:#315ce9}.green{background:#38a64b}.yellow{background:#d9a80b}.wild{background:conic-gradient(#e32636 0 25%,#e9b91a 0 50%,#38a64b 0 75%,#315ce9 0)}.back{background:#111}.hand{display:flex;overflow-x:auto;padding:12px 3px 20px;gap:0}.hand .card{margin-left:-13px;width:58px;height:88px;font-size:22px}.hand .card:first-child{margin-left:0}.notice{background:#080b08c9;border:1px solid #465047;padding:12px;border-radius:14px;text-align:center;font-size:13px}.pill{border:1px solid #718172;border-radius:999px;padding:7px 10px;font-size:11px}.colorbtn{border:0;width:42px;height:42px;border-radius:50%;margin:5px}.error{color:#ffb6b6;white-space:pre-wrap;font-size:12px}
</style></head><body><main class="app"><div class="top"><span class="brand">ELARA · MINI GAMES</span><button class="pill" id="help">RULES</button></div><div><div class="title">UNO</div><div class="sub">PLAY WITH FRIENDS</div></div>
<section id="lobby" class="panel"><div class="section">ONLINE LOBBY</div><div class="field"><input id="roomCode" placeholder="Room code" style="min-width:0;flex:1;background:transparent;border:0;color:white;font-size:16px;text-transform:uppercase"><button class="btn secondary" id="join">JOIN</button></div><button class="btn" id="create">＋ CREATE ROOM</button><div id="roomInfo" class="field hidden"></div><div class="section">PLAYERS <span id="count">0</span>/6</div><div id="players"></div><div class="row"><button class="btn secondary" id="copy">COPY INVITE</button><button class="btn" id="start">START GAME</button></div><p class="muted">Open this Mini App from Telegram. Host starts when at least 2 players join.</p><div id="lobbyError" class="error"></div></section>
<section id="game" class="panel hidden"><div class="top"><button class="pill" id="exit">LOBBY</button><span class="pill" id="turnLabel">YOUR TURN</span><span class="pill" id="colorLabel">RED</span></div><div id="opponents"></div><div class="table"><div class="piles"><div><button class="card back" id="draw">UNO</button><div class="muted">DRAW PILE</div></div><div><div class="card red" id="topCard">7</div><div class="muted">DISCARD</div></div></div><div class="notice" id="status">Waiting for game…</div></div><div class="top"><b>YOUR HAND</b><span class="muted" id="handCount"></span></div><div class="hand" id="hand"></div><div class="row"><button class="btn secondary" id="uno">CALL UNO!</button><button class="btn secondary" id="drawBtn">＋ DRAW</button></div><div id="colors" class="hidden" style="text-align:center"><div class="section">CHOOSE COLOUR</div><button class="colorbtn red" data-color="red"></button><button class="colorbtn yellow" data-color="yellow"></button><button class="colorbtn green" data-color="green"></button><button class="colorbtn blue" data-color="blue"></button></div></section><section id="result" class="panel hidden"><div class="title" style="font-size:34px">🏆 UNO!</div><p id="resultText" style="text-align:center"></p><button class="btn" id="backLobby">BACK TO LOBBY</button></section></main>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const $=id=>document.getElementById(id);let room='',ws=null,state=null,pendingIndex=null,inviteUrl='';const initData=tg?.initData||'';const api=(path,method='GET',body)=>fetch(path,{method,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},body:body?JSON.stringify(body):undefined}).then(async r=>{let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d});function err(t){$('lobbyError').textContent=t;$('status').textContent=t}function connect(code){room=code;inviteUrl='Room code: '+code; if(ws)ws.close();let u=new URL('/ws/'+code,location.href);u.protocol=location.protocol==='https:'?'wss:':'ws:';u.searchParams.set('initData',initData);ws=new WebSocket(u);ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error'){err(m.message);return}if(m.type==='state'){state=m.state;render(m.host)}};ws.onclose=()=>{};$('roomInfo').classList.remove('hidden');$('roomInfo').textContent='ROOM '+code+' · Share the code with friends';$('roomCode').value=code;$('lobbyError').textContent=''}function send(action,extra={}){if(!ws||ws.readyState!==1)return err('Connecting… please try again.');ws.send(JSON.stringify({action,...extra}))}
$('create').onclick=async()=>{try{let d=await api('/api/rooms','POST');connect(d.room)}catch(e){err(e.message)}};$('join').onclick=async()=>{try{let c=$('roomCode').value.trim().toUpperCase();if(!c)throw Error('Enter a room code.');await api('/api/rooms/'+c+'/join','POST');connect(c)}catch(e){err(e.message)}};$('start').onclick=()=>send('start');$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(inviteUrl||location.href);$('lobbyError').textContent='Invite link copied.'}catch{$('lobbyError').textContent='Room code: '+room}};$('exit').onclick=()=>{$('game').classList.add('hidden');$('lobby').classList.remove('hidden')};$('backLobby').onclick=()=>{$('result').classList.add('hidden');$('lobby').classList.remove('hidden')};$('draw').onclick=$('drawBtn').onclick=()=>send('draw');$('uno').onclick=()=>send('uno');$('help').onclick=()=>alert('Classic UNO rules: match colour or symbol; wild cards choose a colour; Skip skips the next player; Reverse changes direction; +2 makes the next player draw two and lose their turn; Wild +4 makes the next player draw four and lose their turn. Draw ends your turn in this version. Call UNO when you have one card.');document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{if(pendingIndex!==null)send('play',{index:pendingIndex,color:b.dataset.color});pendingIndex=null;$('colors').classList.add('hidden')});
function render(host){$('count').textContent=state.players.length;$('players').innerHTML=state.players.map(p=>`<div class="player"><div>🎴</div><div><b>${escapeHtml(p.name)}</b><div class="muted">${p.id===host?'HOST':p.is_turn?'CURRENT TURN':'PLAYER'} · ${p.count} cards</div></div><span>${p.is_me?'YOU':''}</span></div>`).join('');if(state.status==='lobby'){ $('lobby').classList.remove('hidden');$('game').classList.add('hidden');return}if(state.status==='finished'){$('game').classList.add('hidden');$('result').classList.remove('hidden');$('resultText').textContent=(state.players.find(p=>p.id===state.winner)?.name||'Player')+' won the game!';return}$('lobby').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');let me=state.players.find(p=>p.is_me),myTurn=me?.is_turn;$('turnLabel').textContent=myTurn?'YOUR TURN':'WAITING';$('colorLabel').textContent=state.current_color.toUpperCase();$('status').textContent=state.last_action;$('handCount').textContent=state.hand.length+' cards';$('topCard').className='card '+(state.top?.color||'wild');$('topCard').textContent=label(state.top);$('draw').textContent=state.draw_count;$('hand').innerHTML='';state.hand.forEach((c,i)=>{let b=document.createElement('button');b.className='card '+(c.color||'wild');b.textContent=label(c);b.title=(c.color||'wild')+' '+c.value;b.onclick=()=>{if(!myTurn)return err('Wait for your turn.');if(c.color===null){pendingIndex=i;$('colors').classList.remove('hidden')}else send('play',{index:i})};$('hand').appendChild(b)});$('opponents').innerHTML=state.players.filter(p=>!p.is_me).map(p=>`<div class="player"><div>👤</div><div><b>${escapeHtml(p.name)}</b><div class="muted">${p.count} cards</div></div><span>${p.is_turn?'◉ TURN':''}</span></div>`).join('')}
function label(c){if(!c)return '?';return ({skip:'⊘',reverse:'⇄',draw2:'+2',wild:'WILD',wild4:'+4'})[c.value]||c.value}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const initial=new URLSearchParams(location.search).get('room');if(initial){$('roomCode').value=initial;$('join').click()}
</script></body></html>
